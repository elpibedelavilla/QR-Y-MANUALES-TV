
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Y MANUALES TV</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #171b25;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 {
  font-size: 38px;
  margin: 35px 10px 12px;
}
p { color: #cbd5e1; font-size: 20px; }
.contenedor {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 40px;
  padding: 35px;
}
.manual {
  background: #292f3d;
  border-radius: 20px;
  padding: 24px;
  width: 340px;
}
.manual img {
  display: block;
  width: 100%;
  height: auto;
  background: white;
  border-radius: 12px;
}
.manual h2 {
  font-size: 25px;
  margin: 18px 0 4px;
}
</style>
</head>
<body>

<h1>QR Y MANUALES</h1>
<p>Escanea el codigo QR con tu movil</p>

<div class="contenedor">

  <div class="manual">
    <img src="acceso%20ibo.png" alt="QR Acceso IBO">
    <h2>ACCESO IBO</h2>
  </div>

  <div class="manual">
    <img src="manual%20qr.png" alt="QR Manual">
    <h2>MANUAL QR</h2>
  </div>

</div>

</body>
</html>
